name: Build app for sideloading

on:
  workflow_dispatch: 

jobs:
  build-sideload:
    runs-on: macos-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select recent Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '>=26.3'

      - name: Build unsigned app for iOS Device
        run: |
          cd src
          # Disabling code signing allows the CI to build the ARM64 binary without certificates
          xcodebuild clean build \
            -scheme GoMap \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived_build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
            
      - name: Package into IPA
        run: |
          cd src
          mkdir -p Payload
          mv derived_build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r GoMap.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: GoMap-Sideloadable
          path: src/GoMap.ipa
          retention-days: 7
